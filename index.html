<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AES Encrypt/Decrypt Test</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        .col-center {
            margin: 0 auto;
        }
        .output-box {
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body style="margin: 20px;">
    <h1 class="text-center">AES Encryption/Decryption Test</h1>
    <button class="btn btn-lg btn-danger" onclick="window.location = window.location">Reload</button>
    <hr>

    <div class="row">
        <div class="col-lg-6">
            <div class="panel panel-success">
                <div class="panel-heading">
                    <div class="panel-title">Encrypt Data</div>
                </div>
                <div class="panel-body">
                    <div class="mb-3">
                        <label for="secretKeyEncode">Secret Key:</label>
                        <input type="text" id="secretKeyEncode" class="form-control" value="hello12345hello12345hello1234523" placeholder="Enter secret key">
                    </div>
                    <div class="mb-3">
                        <input type="checkbox" id="isEncodePayloadObject" checked>
                        <label for="isEncodePayloadObject">Is JSON Object</label>
                    </div>
                    <div class="mb-3">
                        <label for="encodePayload">Data to Encrypt:</label>
                        <textarea id="encodePayload" class="form-control" rows="5" placeholder='Enter data (e.g., {"username":"john","email":"john@example.com"})'></textarea>
                    </div>
                    <button class="btn btn-success btn-block mt-2"  onclick="encryptData()">Encrypt</button>
                </div>
                <div class="panel-footer">
                    <div class="mb-3">
                        <label for="encryptedIV">IV (Base64):</label>
                        <textarea id="encryptedIV" class="form-control" rows="2" readonly></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="encryptedData">Encrypted Data:</label>
                        <textarea id="encryptedData" class="form-control" rows="5" readonly></textarea>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="panel panel-info">
                <div class="panel-heading">
                    <div class="panel-title">Decrypt Data</div>
                </div>
                <div class="panel-body">
                    <div class="mb-3">
                        <label for="secretKeyDecode">Secret Key:</label>
                        <input type="text" id="secretKeyDecode" class="form-control" value="hello12345hello12345hello1234523" placeholder="Enter secret key">
                    </div>
                    <div class="mb-3">
                        <input type="checkbox" id="isDecodePayloadObject" checked>
                        <label for="isDecodePayloadObject">Parse as JSON</label>
                    </div>
                    <div class="mb-3">
                        <label for="decryptIV">IV (Base64):</label>
                        <textarea id="decryptIV" class="form-control" rows="2" placeholder="Paste IV here"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="decryptData">Encrypted Data:</label>
                        <textarea id="decryptData" class="form-control" rows="5" placeholder="Paste encrypted data here"></textarea>
                    </div>
                    <button class="btn btn-info btn-block mt-2" onclick="decryptData()">Decrypt</button>
                </div>
                <div class="panel-footer">
                    <div class="mb-3">
                        <label for="decryptedOutput">Decrypted Data:</label>
                        <textarea id="decryptedOutput" class="form-control" rows="5" readonly></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <!-- Bootstrap JavaScript -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <!-- CryptoJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

  <script>
    function encryptData() {
        try {
            let data = $("#encodePayload").val().trim();
            let secretKey = $("#secretKeyEncode").val().trim();

            if (!data) {
                alert("Please enter data to encrypt");
                return;
            }
            if (!secretKey) {
                alert("Please enter a secret key (Base64, 32 bytes)");
                return;
            }

            let isDataObject = $("#isEncodePayloadObject").is(":checked");
            if (isDataObject) {
                try {
                    data = JSON.stringify(JSON.parse(data));
                } catch (e) {
                    alert("Invalid JSON format");
                    return;
                }
            }

            // ✅ Parse Base64 key
            const key = CryptoJS.enc.Base64.parse(secretKey);

            // ✅ Generate random 16-byte IV
            const iv = CryptoJS.lib.WordArray.random(16);

            // ✅ Encrypt (AES-256-CBC with PKCS7)
            const encrypted = CryptoJS.AES.encrypt(data, key, {
                iv: iv,
                mode: CryptoJS.mode.CBC,
                padding: CryptoJS.pad.Pkcs7,
            });

            // ✅ Output Base64 IV and Ciphertext
            $("#encryptedIV").val(CryptoJS.enc.Base64.stringify(iv));
            $("#encryptedData").val(encrypted.toString());

            // Autofill decrypt side
            $("#decryptIV").val($("#encryptedIV").val());
            $("#decryptData").val($("#encryptedData").val());

            alert("Encryption successful!");
        } catch (error) {
            alert("Encryption error: " + error.message);
        }
    }

    function decryptData() {
        try {
            let ivBase64 = $("#decryptIV").val().trim();
            let encryptedData = $("#decryptData").val().trim();
            let secretKey = $("#secretKeyDecode").val().trim();

            if (!ivBase64 || !encryptedData) {
                alert("Please enter both IV and encrypted data");
                return;
            }
            if (!secretKey) {
                alert("Please enter a secret key (Base64, 32 bytes)");
                return;
            }

            // ✅ Parse Base64 key + IV
            const key = CryptoJS.enc.Base64.parse(secretKey);
            const iv = CryptoJS.enc.Base64.parse(ivBase64);

            // ✅ Decrypt
            const decrypted = CryptoJS.AES.decrypt(encryptedData, key, {
                iv: iv,
                mode: CryptoJS.mode.CBC,
                padding: CryptoJS.pad.Pkcs7,
            });

            let decryptedStr = decrypted.toString(CryptoJS.enc.Utf8);

            if (!decryptedStr) {
                alert("Decryption failed. Wrong key/IV/data.");
                return;
            }

            if ($("#isDecodePayloadObject").is(":checked")) {
                try {
                    decryptedStr = JSON.stringify(JSON.parse(decryptedStr), null, 2);
                } catch (e) {
                    // leave as plain string if not JSON
                }
            }

            $("#decryptedOutput").val(decryptedStr);
            alert("Decryption successful!");
        } catch (error) {
            alert("Decryption error: " + error.message);
        }
    }
</script>


</body>
</html>
