<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AES Encrypt/Decrypt Test</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        .col-center {
            margin: 0 auto;
        }
        .output-box {
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            margin-top: 10px;
        }
        .mt-2 {
            margin-top: 8px;
        }
    </style>
    <script>
  (function () {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = 64;
    canvas.height = 64;

    // Create and manage favicon entirely via JS
    let favicon = document.querySelector("link[rel='icon']");
    if (!favicon) {
      favicon = document.createElement("link");
      favicon.rel = "icon";
      document.head.appendChild(favicon);
    }

    let hue = 0;
    function draw() {
      ctx.clearRect(0, 0, 64, 64);

      // Fancy gradient background
      const gradient = ctx.createRadialGradient(32, 32, 5, 32, 32, 30);
      gradient.addColorStop(0, `hsl(${hue}, 90%, 60%)`);
      gradient.addColorStop(1, `hsl(${(hue + 100) % 360}, 90%, 40%)`);
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(32, 32, 28, 0, Math.PI * 2);
      ctx.fill();

      // Inner pulse ring
      ctx.strokeStyle = `hsla(${hue}, 100%, 80%, 0.6)`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(32, 32, 25 + Math.sin(Date.now() / 300) * 2, 0, Math.PI * 2);
      ctx.stroke();

      // Center icon/text
      ctx.font = "bold 28px sans-serif";
      ctx.fillStyle = "white";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("⚡", 32, 35);

      favicon.href = canvas.toDataURL("image/png");
      hue = (hue + 2) % 360;
      requestAnimationFrame(draw);
    }

    draw();
  })();
</script>

</head>
<body style="margin: 20px;">
    <h1 class="text-center">AES Encryption/Decryption Test</h1>
    <button class="btn btn-lg btn-danger" onclick="window.location = window.location">Reload</button>
    <hr>

    <div class="row">
        <div class="col-lg-6">
            <div class="panel panel-success">
                <div class="panel-heading">
                    <div class="panel-title">Encrypt Data</div>
                </div>
                <div class="panel-body">
                    <div class="mb-3">
                        <label for="secretKeyEncode">Secret Key:</label>
                        <input type="text" id="secretKeyEncode" class="form-control" value="your-256-bit-encryption-key" placeholder="Enter secret key">
                    </div>
                    <div class="mb-3">
                        <input type="checkbox" id="isEncodePayloadObject" checked>
                        <label for="isEncodePayloadObject">Is JSON Object</label>
                    </div>
                    <div class="mb-3">
                        <label for="encodePayload">Data to Encrypt:</label>
                        <textarea id="encodePayload" class="form-control" rows="5" placeholder='Enter data (e.g., {"username":"john","email":"john@example.com"})'></textarea>
                    </div>
                    <button class="btn btn-success btn-block mt-2" onclick="encryptData()">Encrypt</button>
                </div>
                <div class="panel-footer">
                    <div class="mb-3">
                        <label for="encryptedData">Encrypted Data:</label>
                        <textarea id="encryptedData" class="form-control" rows="5" readonly></textarea>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="panel panel-info">
                <div class="panel-heading">
                    <div class="panel-title">Decrypt Data</div>
                </div>
                <div class="panel-body">
                    <div class="mb-3">
                        <label for="secretKeyDecode">Secret Key:</label>
                        <input type="text" id="secretKeyDecode" class="form-control" value="your-256-bit-encryption-key" placeholder="Enter secret key">
                    </div>
                    <div class="mb-3">
                        <input type="checkbox" id="isDecodePayloadObject" checked>
                        <label for="isDecodePayloadObject">Parse as JSON</label>
                    </div>
                    <div class="mb-3">
                        <label for="decryptData">Encrypted Data:</label>
                        <textarea id="decryptData" class="form-control" rows="5" placeholder="Paste encrypted data here"></textarea>
                    </div>
                    <button class="btn btn-info btn-block mt-2" onclick="decryptData()">Decrypt</button>
                </div>
                <div class="panel-footer">
                    <div class="mb-3">
                        <label for="decryptedOutput">Decrypted Data:</label>
                        <textarea id="decryptedOutput" class="form-control" rows="5" readonly></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <!-- Bootstrap JavaScript -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <!-- CryptoJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

  <script>
    function encryptData() {
        try {
            let data = $("#encodePayload").val().trim();
            let secretKey = $("#secretKeyEncode").val().trim();

            if (!data) {
                alert("Please enter data to encrypt");
                return;
            }
            if (!secretKey) {
                alert("Please enter a secret key");
                return;
            }

            let isDataObject = $("#isEncodePayloadObject").is(":checked");
            if (isDataObject) {
                try {
                    data = JSON.stringify(JSON.parse(data));
                } catch (e) {
                    alert("Invalid JSON format");
                    return;
                }
            }

            // ✅ Simple AES encryption (no IV)
            const encrypted = CryptoJS.AES.encrypt(data, secretKey).toString();

            // ✅ Output encrypted data
            $("#encryptedData").val(encrypted);

            // Autofill decrypt side
            $("#decryptData").val(encrypted);

            alert("Encryption successful!");
        } catch (error) {
            alert("Encryption error: " + error.message);
        }
    }

    function decryptData() {
        try {
            let encryptedData = $("#decryptData").val().trim();
            let secretKey = $("#secretKeyDecode").val().trim();

            if (!encryptedData) {
                alert("Please enter encrypted data");
                return;
            }
            if (!secretKey) {
                alert("Please enter a secret key");
                return;
            }

            // ✅ Simple AES decryption (no IV)
            const decryptedBytes = CryptoJS.AES.decrypt(encryptedData, secretKey);
            let decryptedStr = decryptedBytes.toString(CryptoJS.enc.Utf8);

            if (!decryptedStr) {
                alert("Decryption failed. Wrong key or corrupted data.");
                return;
            }

            if ($("#isDecodePayloadObject").is(":checked")) {
                try {
                    decryptedStr = JSON.stringify(JSON.parse(decryptedStr), null, 2);
                } catch (e) {
                    // leave as plain string if not JSON
                }
            }

            $("#decryptedOutput").val(decryptedStr);
            
        } catch (error) {
            alert("Decryption error: " + error.message);
        }
    }
</script>


</body>
</html>
